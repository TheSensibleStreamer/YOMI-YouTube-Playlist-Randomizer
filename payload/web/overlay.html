<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%;}
#root{position:relative;width:100%;height:100%;overflow:visible;}
#layout{position:absolute;inset:0;display:flex;align-items:center;overflow:visible;z-index:2;}
.media{flex:none;overflow:hidden;background:#111;box-sizing:border-box;position:relative;}
.media img,.media video{width:100%;height:100%;display:block;object-fit:cover;}
.media::after{content:"";position:absolute;inset:0;box-sizing:border-box;border:var(--yomi-border-width,0px) solid var(--yomi-border-color,#252525);border-radius:inherit;pointer-events:none;z-index:30;}
#videoBox video{object-fit:contain;transform-origin:center center;position:absolute;inset:0;}
#info{position:relative;overflow:visible;white-space:nowrap;z-index:4;align-self:stretch;display:flex;flex-direction:column;justify-content:center;}
.text{font-weight:500;white-space:nowrap;overflow:visible;text-overflow:clip;paint-order:stroke fill;position:relative;z-index:5;}
#viz{position:absolute;top:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none;}
#vizSrc{position:absolute;left:-9999px;top:-9999px;opacity:0;pointer-events:none;}
</style></head><body>
<div id="root"><canvas id="viz"></canvas><video id="vizSrc" muted playsinline preload="auto"></video><div id="layout"><div id="artBox" class="media"><img id="art" alt=""></div><div id="videoBox" class="media"><video id="v0" muted playsinline preload="auto"></video><video id="v1" muted playsinline preload="auto" style="visibility:hidden"></video></div><div id="info"><div id="title" class="text"></div><div id="channel" class="text"></div></div></div></div>
<script>
'use strict';
let cfg=null,state=null,stateAt=0,lastTrackSig='',activeVideo=0,currentVideoUrl='';
let vizTrack=0,vizUrl='',vizReady=false,lastDraw=0;
const layout=document.getElementById('layout'),artBox=document.getElementById('artBox'),art=document.getElementById('art'),videoBox=document.getElementById('videoBox');
const videos=[document.getElementById('v0'),document.getElementById('v1')],info=document.getElementById('info'),title=document.getElementById('title'),channel=document.getElementById('channel');
const viz=document.getElementById('viz'),vctx=viz.getContext('2d',{alpha:true,willReadFrequently:true}),vizSrc=document.getElementById('vizSrc'),scratch=document.createElement('canvas'),sctx=scratch.getContext('2d',{alpha:false,willReadFrequently:true});
vctx.imageSmoothingEnabled=false;sctx.imageSmoothingEnabled=false;
function targetTime(){if(!state||!state.clock)return 0;let t=Number(state.clock.time)||0;if(!state.clock.paused){const sp=Number(state.clock.speed)||1;t+=((Math.max(0,Number(state.clock.age_ms)||0)/1000)+(Math.max(0,performance.now()-stateAt)/1000))*sp;}return Math.max(0,t);}
function radius(){const s=String(cfg.media_corner_style||'Square');return s==='Rounded'?'14px':(s==='Soft Rounded'?'7px':'0');}
function applyConfig(){if(!cfg)return;const right=String(cfg.corner||'Top Left').endsWith('Right');layout.style.flexDirection=right?'row-reverse':'row';layout.style.justifyContent='flex-start';
 const bp=cfg.media_border_enabled?Math.max(0,Number(cfg.media_border_px)||0):0;const both=Boolean(cfg.artwork_enabled&&cfg.video_enabled);videoBox.style.marginLeft=(both&&!right&&bp>0)?(-bp)+'px':'0';videoBox.style.marginRight=(both&&right&&bp>0)?(-bp)+'px':'0';
 const hasMedia=Boolean(cfg.artwork_enabled||cfg.video_enabled);info.style.paddingLeft=(hasMedia&&!right)?'14px':'0';info.style.paddingRight=(hasMedia&&right)?'14px':'0';
 let align=String(cfg.text_alignment||'Auto').toLowerCase();if(align==='auto')align=right?'right':'left';info.style.textAlign=align;info.style.alignItems=align==='right'?'flex-end':(align==='center'?'center':'flex-start');
 [artBox,videoBox].forEach(b=>{b.style.border='none';b.style.borderRadius=radius();b.style.setProperty('--yomi-border-width',bp+'px');b.style.setProperty('--yomi-border-color',cfg.media_border_color||'#252525');});
 artBox.style.display=cfg.artwork_enabled?'block':'none';if(cfg.artwork_enabled&&!art.dataset.base)artBox.style.visibility='hidden';artBox.style.width=cfg.media_width+'px';artBox.style.height=cfg.media_height+'px';
 videoBox.style.display=cfg.video_enabled?'block':'none';if(cfg.video_enabled&&!videoBox.dataset.ready)videoBox.style.visibility='hidden';videoBox.style.width=cfg.media_width+'px';videoBox.style.height=cfg.media_height+'px';videos.forEach(v=>v.style.transform='scale('+(Number(cfg.video_zoom)||1.25)+')');
 const fs=(Number(cfg.text_size)||33)+'px',stroke=(Number(cfg.text_outline)||0)+'px '+(cfg.outline_color||'#151515');let lh=1.08;if(cfg.title_channel_spacing==='Tight')lh=.96;if(cfg.title_channel_spacing==='Loose')lh=1.22;
 [title,channel].forEach(e=>{e.style.fontFamily='"'+String(cfg.text_font||'Bahnschrift Condensed').replace(/"/g,'')+'", "Segoe UI", sans-serif';e.style.fontSize=fs;e.style.lineHeight=String(lh);e.style.color=cfg.text_color||'#F2F0E8';e.style.opacity=String(Number(cfg.text_opacity)||1);e.style.webkitTextStroke=stroke;e.style.textShadow=cfg.text_glow?'0 0 5px currentColor,0 0 10px currentColor':'none';});
 title.style.display=cfg.title_enabled?'block':'none';channel.style.display=cfg.channel_enabled?'block':'none';
 const cw=Math.max(320,Number(cfg.canvas_width)||2560),mw=Math.max(20,Number(cfg.media_width)||160),oh=Math.max(24,Number(cfg.overlay_height)||Number(cfg.media_height)||90);let mediaExtent=0;if(cfg.artwork_enabled)mediaExtent+=mw;if(cfg.video_enabled)mediaExtent+=mw;if(cfg.artwork_enabled&&cfg.video_enabled&&bp>0)mediaExtent-=bp;
 let mult=Number(cfg.visualizer_length_multiplier)||4;mult=Math.max(1,Math.min(10,mult));const vw=Math.min(Math.max(80,Math.round(mw*mult)),Math.max(80,cw-mediaExtent)),vx=Math.max(0,right?(cw-mediaExtent-vw):mediaExtent),iw=Math.max(8,Number(cfg.visualizer_internal_width)||40),ih=Math.max(4,Number(cfg.visualizer_internal_height)||10);
 if(viz.width!==iw||viz.height!==ih){viz.width=iw;viz.height=ih;scratch.width=iw;scratch.height=ih;}viz.style.display=cfg.visualizer_enabled?'block':'none';viz.style.left=vx+'px';viz.style.width=vw+'px';viz.style.height=oh+'px';viz.style.opacity=String(Number(cfg.visualizer_opacity)||.3);viz.style.transform=cfg.visualizer_direction==='Mirrored'?'scaleX(-1)':'none';viz.style.zIndex=cfg.visualizer_layer==='Above text'?'8':'1';}
async function loadConfig(){try{cfg=await(await fetch('/config?t='+Date.now(),{cache:'no-store'})).json();applyConfig();}catch(_){}}
function stageVideo(url){if(!cfg.video_enabled||!url){currentVideoUrl='';videoBox.dataset.ready='';videoBox.style.visibility='hidden';videos.forEach(v=>{v.pause();v.style.visibility='hidden';v.removeAttribute('src');});return;}if(currentVideoUrl===url)return;currentVideoUrl=url;const next=1-activeVideo,v=videos[next];v.pause();v.style.visibility='hidden';v.src=url+'?t='+Date.now();v.load();let committed=false;const commit=()=>{if(committed)return;committed=true;const tt=targetTime();try{v.currentTime=Math.min(tt,Number.isFinite(v.duration)?Math.max(0,v.duration-.04):tt);}catch(_){}v.play().catch(()=>{});v.style.visibility='visible';videoBox.dataset.ready='1';videoBox.style.visibility='visible';videos[activeVideo].style.visibility='hidden';videos[activeVideo].pause();activeVideo=next;};v.oncanplay=commit;}
function stageVisualizer(t){const idx=Number(t.index)||0,url=t.visualizer||'';if(!cfg.visualizer_enabled||!url){vizTrack=idx;vizUrl='';vizReady=false;vizSrc.pause();vizSrc.removeAttribute('src');vizSrc.load();vctx.clearRect(0,0,viz.width,viz.height);return;}if(vizTrack===idx&&vizUrl===url)return;vizTrack=idx;vizUrl=url;vizReady=false;vizSrc.pause();vizSrc.src=url+'?t='+Date.now();vizSrc.load();}
vizSrc.addEventListener('canplay',()=>{vizReady=true;syncVisualizer();});
function updateTrack(t){title.textContent=t.title||'';channel.textContent=t.channel||'';if(cfg.artwork_enabled){if(t.artwork){if(art.dataset.base!==t.artwork){art.dataset.base=t.artwork;art.src=t.artwork+'?t='+Date.now();}art.style.visibility='visible';artBox.style.visibility='visible';}else{art.dataset.base='';art.style.visibility='hidden';artBox.style.visibility='hidden';}}stageVideo(t.video||'');stageVisualizer(t);}
function syncVideo(){if(!cfg||!cfg.video_enabled)return;const v=videos[activeVideo];if(v.style.visibility==='hidden'||v.readyState<2)return;const target=targetTime();if(state.clock.paused){v.pause();return;}if(Math.abs(v.currentTime-target)>.10&&!v.seeking){try{v.currentTime=target;}catch(_){}}if(v.paused)v.play().catch(()=>{});}
function syncVisualizer(){if(!vizReady||!state||!state.track||Number(state.track.index)!==vizTrack)return;let tt=targetTime();if(Number.isFinite(vizSrc.duration))tt=Math.min(tt,Math.max(0,vizSrc.duration-1/30));if(!vizSrc.seeking&&Math.abs(vizSrc.currentTime-tt)>.05){try{vizSrc.currentTime=tt;}catch(_){}}if(state.clock.paused)vizSrc.pause();else if(vizSrc.paused)vizSrc.play().catch(()=>{});}
async function poll(){try{state=await(await fetch('/state?t='+Date.now(),{cache:'no-store'})).json();stateAt=performance.now();if(state.track){const t=state.track,sig=[t.index||0,t.title||'',t.channel||'',t.artwork||'',t.video||'',t.visualizer||''].join('|');if(sig!==lastTrackSig){lastTrackSig=sig;updateTrack(t);}syncVideo();syncVisualizer();}}catch(_){}setTimeout(poll,100);}
function hexRgb(h){h=String(h||'#ffffff').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function lerp(a,b,t){return a+(b-a)*t;}function mix(c1,c2,t){return[c1.map?0:0]&&[];}function mixRgb(a,b,t){return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
function hsl(h,s,l){h=((h%360)+360)%360/360;const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);return l-a*Math.max(-1,Math.min(k-3,9-k,1));};return[f(0)*255,f(8)*255,f(4)*255];}
function gradientColors(){const p=String(cfg.visualizer_gradient_preset||'Sunset');const map={Sunset:['#FF6B6B','#FFA552','#C4A7FF'],Ocean:['#72A7FF','#70E1F5','#9B7BFF'],Pastel:['#FF86C8','#C4A7FF','#70E1F5'],Fire:['#FF6B6B','#FFA552','#FFD166'],Forest:['#2E7D32','#7BE495','#FFD166'],Mono:['#F2F0E8','#8A8A84','#252525']};return(map[p]||map.Sunset).map(hexRgb);}
function vizColor(x,y,w,h){const mode=String(cfg.visualizer_color_mode||'Solid');if(mode==='Rainbow'){const t=(cfg.visualizer_gradient_orientation==='Vertical'?y/Math.max(1,h-1):x/Math.max(1,w-1));return hsl(t*360,.85,.62);}if(mode==='Gradient'){const cs=gradientColors(),t=(cfg.visualizer_gradient_orientation==='Vertical'?y/Math.max(1,h-1):x/Math.max(1,w-1));return t<.5?mixRgb(cs[0],cs[1],t*2):mixRgb(cs[1],cs[2],(t-.5)*2);}return hexRgb(cfg.visualizer_solid_color||'#8A8A84');}
function drawVisualizer(now){
 requestAnimationFrame(drawVisualizer);
 if(!cfg||!cfg.visualizer_enabled||now-lastDraw<1000/30)return;
 lastDraw=now;
 if(!vizReady||vizSrc.readyState<2){
   if(!vizReady)vctx.clearRect(0,0,viz.width,viz.height);
   return;
 }
 try{
   const w=scratch.width,h=scratch.height;
   sctx.drawImage(vizSrc,0,0,w,h);
   const im=sctx.getImageData(0,0,w,h),d=im.data;
   let minX=w,maxX=-1;

   for(let y=0;y<h;y++){
     for(let x=0;x<w;x++){
       const i=(y*w+x)*4,b=(d[i]+d[i+1]+d[i+2])/3;
       if(b<80){
         d[i]=d[i+1]=d[i+2]=d[i+3]=0;
       }else{
         const c=vizColor(x,y,w,h);
         d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;
         if(x<minX)minX=x;
         if(x>maxX)maxX=x;
       }
     }
   }

   vctx.clearRect(0,0,viz.width,viz.height);
   if(maxX<0)return;

   // showfreqs can leave blank internal columns at the outer edge.
   // Extra Chunky is 40 internal pixels stretched across ~640 CSS px, so ONE
   // blank source column becomes ~16 visible pixels -- almost exactly the old
   // text padding. Normalize the actual lit pixels to the edge touching media.
   const right=String(cfg.corner||'Top Left').endsWith('Right');
   const mirrored=String(cfg.visualizer_direction||'Normal')==='Mirrored';

   // CSS scaleX(-1) reverses which source edge ultimately touches media.
   const alignSourceRight=(right!==mirrored);
   const shift=alignSourceRight?(w-1-maxX):(-minX);

   const out=vctx.createImageData(w,h),od=out.data;

   for(let y=0;y<h;y++){
     for(let x=0;x<w;x++){
       const si=(y*w+x)*4;
       if(d[si+3]===0)continue;

       const dx=x+shift;
       if(dx<0||dx>=w)continue;

       const di=(y*w+dx)*4;
       od[di]=d[si];
       od[di+1]=d[si+1];
       od[di+2]=d[si+2];
       od[di+3]=d[si+3];
     }
   }

   vctx.putImageData(out,0,0);
 }catch(_){}
}
(async()=>{await loadConfig();setInterval(loadConfig,1500);poll();requestAnimationFrame(drawVisualizer);})();
</script></body></html>
