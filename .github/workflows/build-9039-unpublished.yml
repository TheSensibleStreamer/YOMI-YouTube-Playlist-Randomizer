name: Build unpublished YOMI 9039 candidate
on:
  push:
    paths:
      - "staging/release-candidate-9039.trigger"
permissions:
  contents: read

jobs:
  candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble sealed release candidate and verify ZIP file hashes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/build_release_candidate.py --version 420.69.9039 --output dist/9039
          if($LASTEXITCODE -ne 0){throw 'Candidate packaging failed'}
      - name: Exercise updater package verification on actual candidate ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path 'dist/9039').Path
          $metadata = Get-Content (Join-Path $root 'update.json') -Raw | ConvertFrom-Json
          if($metadata.version -ne '420.69.9039'){throw 'Wrong release candidate identity'}
          $zip = Join-Path $root $metadata.package_name
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne $metadata.sha256){throw 'Updater manifest ZIP hash mismatch'}
          $extract = Join-Path $env:RUNNER_TEMP 'YOMI-9039-extracted'
          $dryData = Join-Path $env:RUNNER_TEMP 'YOMI-9039-dryrun'
          & 'payload/app/update-deployment.ps1' -Prepare -PackagePath $zip -ExtractRoot $extract -ExpectedVersion '420.69.9039' -ExpectedPackageHash $hash -InstallRoot (Join-Path $env:RUNNER_TEMP 'YOMI-NOT-INSTALLED') -DataRoot $dryData
          if($LASTEXITCODE -ne 0){throw 'Updater ZIP verification rejected candidate'}
          if(-not (Test-Path (Join-Path $extract 'installer/build-manifest.json'))){throw 'Expected extraction missing'}
      - name: Verify staged source seal and installation contract (before runtime binaries exist)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $extract = Join-Path $env:RUNNER_TEMP 'YOMI-9039-extracted'
          $payload = Join-Path $extract 'payload'
          $app = Join-Path $payload 'app'
          $contract = Get-Content (Join-Path $app 'YOMI-CAPABILITY-CONTRACT.json') -Raw | ConvertFrom-Json
          $receipt = Get-Content (Join-Path $app 'INSTALLATION-RECEIPT.json') -Raw | ConvertFrom-Json
          $seal = Get-Content (Join-Path $app 'RUNTIME-INTEGRITY-MANIFEST.json') -Raw | ConvertFrom-Json
          $version = (Get-Content (Join-Path $payload 'VERSION.txt') -Raw).Trim()
          if($version -ne '420.69.9039' -or $contract.version -ne $version -or $receipt.version -ne $version -or $seal.version -ne $version){throw 'Candidate identity mismatch'}
          if(@($seal.files).Count -ne [int]$seal.file_count){throw 'Source seal count mismatch'}
          foreach($entry in $seal.files){
            $file = Join-Path $payload ([string]$entry.path).Replace('/','\')
            if(-not (Test-Path -LiteralPath $file -PathType Leaf)){throw "Source seal file missing: $file"}
            if((Get-Item -LiteralPath $file).Length -ne [int64]$entry.bytes){throw "Source seal byte mismatch: $file"}
            if((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne [string]$entry.sha256){throw "Source seal hash mismatch: $file"}
          }
          Write-Host "PASS: sealed $($seal.file_count) packaged runtime sources; installed binaries are separately created and validated by the installer."
          # Full release-qualification -Mode Sealed is only valid after installer-generated binaries exist.

      - name: Upload candidate ZIP and proposed update manifest (NOT PUBLISHED)
        uses: actions/upload-artifact@v4
        with:
          name: YOMI-420.69.9039-UNPUBLISHED-CANDIDATE
          path: |
            dist/9039/YOMI-v420.69.9039.zip
            dist/9039/update.json
          if-no-files-found: error
          retention-days: 7
