name: Validate staged YOMI font picker
on:
  push:
    paths:
      - "staging/font-picker.trigger"
permissions:
  contents: read

jobs:
  validate-font-picker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate updater and media resampling
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'

          foreach($script in @('installer/install.ps1','payload/app/update.ps1','payload/app/YomiPublicUpdateHost.ps1','payload/app/server.ps1','payload/app/YomiDiagnosticBundle.ps1','payload/app/unavailable-track-audit.ps1','payload/app/YomiMusicEndpointResolver.ps1','payload/app/YomiFontPack.ps1','payload/app/release-qualification.ps1')){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ($script+' parse failed: '+$errors[0].Message)}
          }
          [xml](Get-Content (Resolve-Path 'payload/app/YomiControllerWpf.xaml') -Raw) | Out-Null
          Get-Content (Resolve-Path 'payload/app/default-config.json') -Raw | ConvertFrom-Json | Out-Null

          function Resolve-FrameworkReferencePath([string]$Name) {
            $loaded=[AppDomain]::CurrentDomain.GetAssemblies() | Where-Object { $_.GetName().Name -eq $Name -and $_.Location } | Select-Object -First 1
            if($loaded){ return [string]$loaded.Location }
            $dirs=@()
            try { $runtimeDir=[Runtime.InteropServices.RuntimeEnvironment]::GetRuntimeDirectory(); if($runtimeDir){$dirs+=$runtimeDir;$dirs+=(Join-Path $runtimeDir 'WPF')} } catch {}
            foreach($frameworkRoot in @((Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319'),(Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319'))){$dirs+=$frameworkRoot;$dirs+=(Join-Path $frameworkRoot 'WPF')}
            $pf86=[Environment]::GetFolderPath([System.Environment+SpecialFolder]::ProgramFilesX86)
            if($pf86){$refRoot=Join-Path $pf86 'Reference Assemblies\Microsoft\Framework\.NETFramework';if(Test-Path $refRoot){foreach($v in @(Get-ChildItem $refRoot -Directory -ErrorAction SilentlyContinue|Where-Object{$_.Name -like 'v4*'}|Sort-Object Name -Descending)){$dirs+=$v.FullName;$dirs+=(Join-Path $v.FullName 'Facades')}}}
            foreach($dir in @($dirs|Where-Object{$_}|Select-Object -Unique)){$candidate=Join-Path $dir ($Name+'.dll');if(Test-Path $candidate){return $candidate}}
            throw ('Missing framework reference: '+$Name)
          }

          $csc=@((Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'),(Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe')) | Where-Object {Test-Path $_} | Select-Object -First 1
          if(-not $csc){throw 'csc.exe not found'}
          $app=(Resolve-Path 'payload/app').Path

          $controllerSource=Join-Path $app 'YomiControllerWpf.cs'
          $controllerManifest=Join-Path $app 'YomiControllerWpf.manifest'
          $controllerOut=Join-Path $env:RUNNER_TEMP 'YomiControllerWpf.exe'
          $refs=@('PresentationFramework','PresentationCore','WindowsBase','System.Xaml','WindowsFormsIntegration','System.Windows.Forms','System.Drawing','System.Web.Extensions','System.Xml','System','System.Core')
          $args=@('/nologo','/noconfig','/codepage:65001','/target:winexe','/platform:anycpu','/optimize+','/debug-',('/win32manifest:"'+$controllerManifest+'"'),('/out:"'+$controllerOut+'"'))
          foreach($refName in $refs){$args+=('/reference:"'+(Resolve-FrameworkReferencePath $refName)+'"')}
          $args+=('"'+$controllerSource+'"')
          $compile=& $csc @args 2>&1
          if($LASTEXITCODE -ne 0){throw ('Controller compile failed: '+($compile -join [Environment]::NewLine))}
          if(-not(Test-Path $controllerOut)){throw 'Controller compile produced no executable'}

          $obsOut=Join-Path $env:RUNNER_TEMP 'YomiObsServer.exe'
          $obsArgs=@('/nologo','/noconfig','/codepage:65001','/target:exe','/platform:anycpu','/optimize+','/debug-',('/out:"'+$obsOut+'"'),('/reference:"'+(Resolve-FrameworkReferencePath 'System')+'"'),('/reference:"'+(Resolve-FrameworkReferencePath 'System.Core')+'"'),('"'+(Join-Path $app 'YomiObsServerHost.cs')+'"'))
          $obsCompile=& $csc @obsArgs 2>&1
          if($LASTEXITCODE -ne 0){throw ('OBS server compile failed: '+($obsCompile -join [Environment]::NewLine))}
          if(-not(Test-Path $obsOut)){throw 'OBS server compile produced no executable'}

          $obs=Get-Content (Join-Path $app 'YomiObsServerHost.cs') -Raw
          foreach($required in @("artCanvas=document.getElementById('artCanvas')","videoCanvas=document.getElementById('videoCanvas')","imageSmoothingEnabled=false","mediaResampleMode=nearestScale?'nearest':'smooth'","c.obs_media_scaling||'Smooth'","c.media_aspect_layout||'Reflow'","mediaPairSvg=document.getElementById('mediaPairSvg')","mediaPairRect=document.getElementById('mediaPairRect')","mediaPairLine=document.getElementById('mediaPairLine')","function layoutMediaPair(active,vertical,bp,color,radiusPx)","mediaPairRect.setAttribute('stroke',color)","mediaPairLine.setAttribute('stroke-linecap','round')","function parseHexColor(v)","vizCtx.imageSmoothingEnabled=false","forceSolid=vizColorMode==='solid'","artFrame.getBoundingClientRect().right","vidFrame.getBoundingClientRect().right")){
            if(-not $obs.Contains($required)){throw ('OBS media/layout repair missing: '+$required)}
          }
          foreach($forbidden in @('mediaPairOutline','mediaSeam',"pixelScale?'pixelated':'auto'")){
            if($obs.Contains($forbidden)){throw ('Obsolete OBS geometry/scaling path still present: '+$forbidden)}
          }

          # Regression: the earlier-history row is not permanently PLAYED
          # when mpv runtime says its audio is immediately transition-ready.
          # Also prove a STARTING engine status cannot hide a demonstrably
          # moving raw playback clock behind Play / 0:00 indefinitely.
          $controllerEvidence=Get-Content $controllerSource -Raw
          foreach($necessary in @(
            'private bool ConfirmPlaybackFromSampledMpvClock(',
            'raw - _clockEvidenceStart >= 0.18',
            '_clockEvidenceSampleMs = stamp;',
            'raw - _clockEvidenceLast > 2.0',
            'if (phase == "starting" && clockIsAdvancing',
            'phase = "playing";',
            'MPV CLOCK PLAY CONFIRM occurrence=',
            'if (runtime != null && runtime.TransitionReady)',
            'ApplyRuntimeQueueStatus(row, runtime);'
          )){
            if(-not $controllerEvidence.Contains($necessary)){throw ('Controller playback/previous-ready contract missing: '+$necessary)}
          }

          $controller=Get-Content $controllerSource -Raw
          foreach($required in @('SettingsObsMediaScaling','FillCombo(_settingsObsMediaScaling, "Smooth", "Nearest")','VisualizerPixelSizeChoiceFromConfig','width = 40; height = 10','page.ScrollToVerticalOffset','"media_aspect_layout", "Reflow"','ComboText(_settingsMediaAspectLayout, "Reflow")','LaunchUnavailableTrackAudit','unavailable-track-audit.ps1','OpenSelectedQueueSource','Open source in browser','Unavailable track audit')){
            if(-not $controller.Contains($required)){throw ('Controller audit/settings repair missing: '+$required)}
          }
          if($controller.Contains('combo.SelectedIndex = next')){throw 'Settings wheel can still mutate closed combo boxes'}

          # Keep normal and pressed window chrome unchanged. Only soften the
          # Close/X hover background by a modest amount relative to #2A1C1F.
          $design=Get-Content 'payload/app/YomiDesign.xaml' -Raw
          if(-not $design.Contains('<Color x:Key="Color.DangerSoft">#503035</Color>')){
            throw 'Close-button hover color is not the agreed subtle red'
          }
          if(-not $design.Contains('<Color x:Key="Color.Danger">#C47F7F</Color>')){
            throw 'Pressed close-button red was changed unintentionally'
          }

          $music=Get-Content (Join-Path $app 'music.lua') -Raw
          # 9034 inserted an additional Lua playback observer immediately
          # before the user's next launch stopped producing audio and OBS.
          # Restore the previously functioning 9033 engine; retain independent
          # controller clock recovery and truthful previous-cache statuses.
          if($music.Contains('playback_clock_pending_index') -or $music.Contains('confirm_playback_started("advancing-transport-clock")')){
            throw 'Known 9034 audio engine experiment is still in the rollback build'
          }
          if(-not $music.Contains('safe_register_event("playback-restart",function()')){
            throw 'Original playback-restart listener missing'
          }
          foreach($required in @('next_subset_transport_occurrence(base,direction,false)','next_occurrence(base,direction,false)','if known_bad(i) then return end','AUDIO QUARANTINE CLEARED track ','extractor-failed-v2|','web_embedded,default','android,default')){
            if(-not $music.Contains($required)){throw ('Playback quarantine repair missing: '+$required)}
          }
          foreach($forbidden in @('AUDIO PERMANENT RECHECK track ','next_occurrence(cursor,1,true)','next_subset_transport_occurrence(base,direction,true)')){
            if($music.Contains($forbidden)){throw ('Unavailable-track resurrection path still present: '+$forbidden)}
          }

          # Track 255's 9028 diagnostic exposed PriorityRun error code 3 before
          # the resolver even started. Never wrap a short metadata lookup in the
          # Windows Job-based media producer helper.
          if(-not $music.Contains('22,true,function(ok,result,error_text,timed_out)')){
            throw 'Music endpoint resolver still launches through PriorityRun'
          }
          if(-not $music.Contains('reason="priorityrun-spawn-failure"')){
            throw 'Music endpoint diagnostic classification missing'
          }

          # Mandatory playback reserve: current, next and previous each outrank
          # discretionary ahead tracks across audio and optional media kinds.
          foreach($required in @(
            'request_bundle(i,0)',
            'request_bundle(next_i,100)',
            'request_bundle(previous_i,200)',
            'request_bundle(following,200+n*100)',
            'while added_ahead<ahead+1',
            'for _=1,active_prefetch_ahead()+1 do',
            'job.priority=math.min(tonumber(job.priority) or 100,requestedPriority)'
          )){
            if(-not $music.Contains($required)){throw ('Priority queue / cache reserve missing: '+$required)}
          }

          $audit=Get-Content (Join-Path $app 'unavailable-track-audit.ps1') -Raw
          foreach($required in @('controller-library.json','state\session.json','pool-current.json','web_embedded,default','android,default','YOMI UNAVAILABLE TRACK AUDIT','Export-Csv')){
            if(-not $audit.Contains($required)){throw ('Unavailable-track audit missing: '+$required)}
          }

          $diag=Get-Content (Join-Path $app 'YomiDiagnosticBundle.ps1') -Raw
          foreach($required in @('YOMI Diagnostic Bundle v12 / R61.106.53','$excludedTreeRegex','Log-Tails','$f.Length -lt 4MB','Select-Object -First 1500')){
            if(-not $diag.Contains($required)){throw ('Compact diagnostic bundle repair missing: '+$required)}
          }

          $defaults=Get-Content (Join-Path $app 'default-config.json') -Raw | ConvertFrom-Json
          if($defaults.media_aspect_layout -ne 'Reflow'){throw 'Reflow is not the default media aspect layout'}
          if($defaults.visualizer_pixel_size -ne 'Extra Chunky' -or [int]$defaults.visualizer_internal_width -ne 40 -or [int]$defaults.visualizer_internal_height -ne 10){throw 'Visualizer chunky defaults are not restored'}

          $updater=Get-Content (Join-Path $app 'update.ps1') -Raw
          if(-not $updater.Contains('Restart handoff is ready.')){throw 'Updater restart handoff missing'}
          if($updater.Contains("Start-Process -FilePath $launcher -ArgumentList 'controller'")){throw 'Updater still has competing relaunch owner'}
          $updaterWindow=Get-Content (Join-Path $app 'YomiPublicUpdateHost.ps1') -Raw
          if(-not $updaterWindow.Contains('SizeToContent="Height"') -or -not $updaterWindow.Contains('MinHeight="152" MaxHeight="208"')){
            throw 'Updater is still a tall fixed-size window'
          }
          if(-not $updaterWindow.Contains('<RowDefinition Height="Auto"/>') -or -not $updaterWindow.Contains('Margin="0,9,0,0" MinWidth="86"')){
            throw 'Updater still reserves a large empty row above the Update button'
          }
          if($updaterWindow.Contains('Width="500" Height="212"')){
            throw 'Legacy 212px updater window returned'
          }
          $obsSquare=Get-Content (Join-Path $app 'YomiObsServerHost.cs') -Raw
          foreach($required in @(
            'let w=Math.max(1,Math.round(sw*fraction));',
            'let selectedColumns=Math.max(1,Math.round(sampleW*Math.max(.25,Math.min(1,vizLengthMultiplier/4))));',
            'let width=Math.max(1,Math.min(available,tr.height*squareAspect));',
            'let height=Math.max(1,width/squareAspect);'
          )){if(-not $obsSquare.Contains($required)){throw ('Square visualizer source-grid rule missing: '+$required)}}
          if($obsSquare.Contains('viz.style.width=(matchText?available:')){
            throw 'Visualizer still stretches to entire text area'
          }

          $updateHostText=Get-Content (Join-Path $app 'YomiPublicUpdateHost.ps1') -Raw
          if(-not $updateHostText.Contains('Queue-DetachedRelaunch')){throw 'Detached restart relay not wired'}
          if(-not $updateHostText.Contains('detached restart relay owns the single post-update relaunch')){throw 'Single restart ownership marker missing'}


      - name: Exercise actual controller mpv clock confirmation on simulated media samples
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & './tests/controller-clock-contract.ps1'
          # The script is PowerShell with terminating assertions and no native
          # process; LASTEXITCODE may remain null even after a successful PASS.

      - name: Verify staged font rows, live wheel preview and focus state
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          [xml]$design=Get-Content 'payload/app/YomiDesign.xaml' -Raw
          [xml]$controllerXaml=Get-Content 'payload/app/YomiControllerWpf.xaml' -Raw
          $designText=Get-Content 'payload/app/YomiDesign.xaml' -Raw
          $controllerText=Get-Content 'payload/app/YomiControllerWpf.cs' -Raw
          $markup=Get-Content 'payload/app/YomiControllerWpf.xaml' -Raw
          foreach($needed in @(
            'x:Key="SettingsFontComboItem"',
            'ContentTemplate="{TemplateBinding ContentTemplate}"',
            'TextElement.FontFamily="{TemplateBinding FontFamily}"',
            'FontFamily="{Binding FontFamily, RelativeSource={RelativeSource AncestorType={x:Type ComboBoxItem}}}"',
            'TargetName="ComboBorder" Property="BorderThickness" Value="2"',
            'TargetName="ComboBorder" Property="BorderBrush" Value="{DynamicResource TextPrimary}"'
          )){
            if(-not $designText.Contains($needed)){throw ('Missing independent font-row/focus template: '+$needed)}
          }
          foreach($needed in @(
            'TryFindResource("SettingsFontComboItem")',
            '_settingsTextFont.SelectionChanged += delegate { RefreshTextFontComboPreview(true); }',
            '_settingsTextFont.Text = choice;',
            'if (combo.IsKeyboardFocusWithin)',
            'if (combo.IsDropDownOpen) return;'
          )){
            if(-not $controllerText.Contains($needed)){throw ('Font selection / focused wheel mismatch: '+$needed)}
          }
          if(-not $markup.Contains('x:Name="SettingsTextFont"')){throw 'Font combo missing from Settings XAML'}
          if(-not $controllerText.Contains('case "advancing": return "STARTING"')){throw 'Normal advancing phase must not display SKIPPING'}
          $obsSource=Get-Content 'payload/app/YomiObsServerHost.cs' -Raw
          foreach($need in @(
            'artFrame.style.borderRadius=r;vidFrame.style.borderRadius=r;',
            'artFrame.style.clipPath=mediaClip;vidFrame.style.clipPath=mediaClip;',
            "viz.style.width='0px';viz.style.height='0px';viz.style.flex='0 0 0px';",
            "mediaPairLine.setAttribute('stroke-linecap','round')"
          )){if(-not $obsSource.Contains($need)){throw ('Missing shared-border/visualizer safeguard: '+$need)}}
          if($obsSource.Contains('.media-frame::after{')){throw 'Media border still uses translucent over-image pseudo-element'}
          if(-not $obsSource.Contains('overflow:hidden;isolation:isolate;background:transparent;border-style:solid')){
            throw 'OBS media frame is not physically bordered and image-clipped'
          }
          if(([regex]::Matches($designText,'<Setter TargetName="B" Property="Background" Value="#503035"/>')).Count -ne 2){
            throw 'Both X hover templates must use the visible muted red'
          }
          $music=Get-Content 'payload/app/music.lua' -Raw
          if(-not $music.Contains('MUSIC ENDPOINT REARM track ')){throw 'Manual failed-prefetch Music lookup cannot retry'}
          foreach($needle in @(
            "artFrame.style.setProperty(vertical?'--yomi-border-bottom':'--yomi-border-right',first+'px');",
            "vidFrame.style.setProperty(vertical?'--yomi-border-top':'--yomi-border-left',second+'px');",
            'layoutMediaPair(false,vertical,bp,borderColor,radiusPx);',
            'shareSeam?Math.max(radiusPx,bp*2+2):radiusPx'
          )){if(-not $obsSource.Contains($needle)){throw ('Media border still doubles the seam or covers inner corners: '+$needle)}}
          Write-Host 'PASS: queue phase, four-corner clipping, visualizer width and Music retry regression checks'
          Write-Host 'PASS: independent popup typefaces, current selection, and visible wheel focus'

  pixel-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare browser pixel tests
        shell: bash
        run: |
          python -m pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium
      - name: Test real OBS overlay corner alpha and shared border thickness
        shell: bash
        run: python tests/obs-border-pixels.py
      - name: Parse whole production Lua audio engine before publishing
        shell: bash
        run: |
          python -m pip install --quiet lupa
          python -c "from lupa.lua51 import LuaRuntime; LuaRuntime().execute(\"assert(loadfile('payload/app/music.lua'))\"); print('PASS complete music.lua parses in mpv-compatible Lua 5.1')"
          python - <<'PY'
          from pathlib import Path
          s=Path('payload/app/music.lua').read_text(encoding='utf-8-sig')
          assert 'playback_clock_pending_index' not in s
          assert 'safe_register_event("playback-restart",function()' in s
          print("PASS restored 9033 audio engine has original mpv event handler")
          PY
