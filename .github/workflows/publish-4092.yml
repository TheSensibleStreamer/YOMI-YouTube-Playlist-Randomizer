name: Publish YOMI 4.2.0.9.2

on:
  push:
    paths:
      - "release/4.2.0.9.2.trigger"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build verified package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-work
          mkdir .release-work
          cp -a payload .release-work/payload
          cp -a installer .release-work/installer
          cp "INSTALL YOMI.cmd" ".release-work/INSTALL YOMI.cmd"

          python release/4.2.0.9.2/build.py .release-work YOMI-v4.2.0.9.2.zip | tee /tmp/yomi-4092-build.json

          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          package = Path("YOMI-v4.2.0.9.2.zip")
          h = hashlib.sha256(package.read_bytes()).hexdigest()
          result = json.loads(Path("/tmp/yomi-4092-build.json").read_text())
          if result["sha256"] != h or result["version"] != "4.2.0.9.2":
              raise SystemExit("outer package verification failed")

          update = {
              "product": "YOMI - YouTube OBS Music Interface",
              "version": "4.2.0.9.2",
              "package_name": "YOMI-v4.2.0.9.2.zip",
              "package_url": "https://raw.githubusercontent.com/TheSensibleStreamer/YOMI-YouTube-Playlist-Randomizer/main/YOMI-v4.2.0.9.2.zip",
              "sha256": h,
              "summary": "YOMI 4.2.0.9.2: fixes in-app update installation locks by releasing the old updater, moving update execution out of Program Files, retrying the atomic swap, and self-verifying the WPF control plane.",
              "changelog_url": "https://github.com/TheSensibleStreamer/YOMI-YouTube-Playlist-Randomizer/blob/main/CHANGELOG.md"
          }
          Path("update.json").write_text(json.dumps(update, indent=2) + "\n", encoding="utf-8")
          Path("YOMI-v4.2.0.9.2.sha256.txt").write_text(h + "  YOMI-v4.2.0.9.2.zip\n", encoding="utf-8")
          PY

          rm -rf payload installer
          cp -a .release-work/payload payload
          cp -a .release-work/installer installer
          cp ".release-work/INSTALL YOMI.cmd" "INSTALL YOMI.cmd"
          rm -rf .release-work

          python - <<'PY'
          from pathlib import Path

          p = Path("README.md")
          if p.exists():
              t = p.read_text(encoding="utf-8")
              t = t.replace("Current version: 4.2.0.9.1", "Current version: 4.2.0.9.2")
              t = t.replace("YOMI-v4.2.0.9.1.zip", "YOMI-v4.2.0.9.2.zip")
              p.write_text(t, encoding="utf-8")

          changelog = "# YOMI Changelog\n\n## 4.2.0.9.2\n\n- Fixed the in-app updater locking its own Program Files app directory during installation.\n- Update execution now moves to LocalAppData before activation, and the installer can bootstrap out of the broken 4.2.0.9/4.2.0.9.1 update path.\n- Added retry-safe atomic installation and an installer-side WPF self-test.\n- Preserves the WPF Settings routing fix from 4.2.0.9.1.\n\n## Previous versions\n\nSee [Previous Versions](./previous/README.md).\n"
          Path("CHANGELOG.md").write_text(changelog, encoding="utf-8")

          pp = Path("previous/README.md")
          if pp.exists():
              t = pp.read_text(encoding="utf-8")
              line = "- [YOMI 4.2.0.9.1](../YOMI-v4.2.0.9.1.zip)\n"
              if line not in t:
                  marker = "# Previous Versions\n\n"
                  t = t.replace(marker, marker + line)
              pp.write_text(t, encoding="utf-8")
          PY

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf release/4.2.0.9.2
          rm -f release/4.2.0.9.2.trigger
          rm -f .github/workflows/publish-4092.yml

          git add -A
          git commit -m "Publish YOMI 4.2.0.9.2"
          git push origin HEAD:main
