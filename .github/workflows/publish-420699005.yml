name: Publish YOMI 420.69.9005
on:
  push:
    paths:
      - "release/420.69.9005.trigger"
permissions:
  contents: write

jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Smart Crop detector and installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $app=(Resolve-Path 'payload/app').Path
          $csc=@(
            (Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'),
            (Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if(-not $csc){throw 'csc.exe not found'}

          $detector=Join-Path $env:RUNNER_TEMP 'ArtworkEdgeDetector.exe'
          & $csc /nologo /target:exe /reference:System.Drawing.dll ('/out:"'+$detector+'"') ('"'+(Join-Path $app 'ArtworkEdgeDetector.cs')+'"')
          if($LASTEXITCODE -ne 0 -or -not(Test-Path $detector)){throw 'ArtworkEdgeDetector compile failed'}

          Add-Type -AssemblyName System.Drawing
          $img=Join-Path $env:RUNNER_TEMP 'colored-pillarbox.png'
          $bmp=New-Object System.Drawing.Bitmap 1280,720
          $g=[System.Drawing.Graphics]::FromImage($bmp)
          $bar=New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(89,62,15))
          $g.FillRectangle($bar,0,0,1280,720)
          $red=New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(180,25,35))
          $blue=New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(30,90,190))
          $g.FillRectangle($red,280,0,360,720)
          $g.FillRectangle($blue,640,0,360,720)
          $bmp.Save($img,[System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose();$bar.Dispose();$red.Dispose();$blue.Dispose();$bmp.Dispose()

          $crop=(& $detector $img 160 90 | Out-String).Trim()
          Write-Host "Synthetic detector: $crop"
          if($crop -notmatch '^CROP\s+720:720:280:0\s+L280\s+T0\s+R280\s+B0'){
            throw ('Colored pillarbox detector regression: '+$crop)
          }

          $music=Get-Content (Join-Path $app 'music.lua') -Raw
          foreach($required in @(
            'function artwork_profile()',
            'ArtworkEdgeDetector.exe',
            'ARTWORK COLOR CROP track ',
            'ART READY SMART-CROP track ',
            'r6110615-crop-restored1'
          )){
            if(-not $music.Contains($required)){throw ('Smart Crop pipeline missing: '+$required)}
          }

          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'installer/install.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count){throw ('Installer parse failed: '+$errors[0].Message)}
          $installer=Get-Content (Resolve-Path 'installer/install.ps1') -Raw
          if($installer.Contains('Compiling restart relay...') -or $installer.Contains('YomiRestartRelay.exe')){
            throw 'Failed 9004 restart-relay installer experiment is still present'
          }

  publish:
    needs: validate-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parse playback Lua
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet luaparser
          python - <<'PY'
          from pathlib import Path
          from luaparser import ast
          ast.parse(Path("payload/app/music.lua").read_text(encoding="utf-8"))
          print("music.lua parse PASS")
          PY
      - name: Build verified package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-work
          mkdir .release-work
          cp -a payload .release-work/payload
          cp -a installer .release-work/installer
          cp "INSTALL YOMI.cmd" ".release-work/INSTALL YOMI.cmd"
          python release/420.69.9005/build.py .release-work YOMI-Windows.zip | tee /tmp/yomi-420699005-build.json
          cp YOMI-Windows.zip YOMI-v420.69.9005.zip
          python -c 'import hashlib,json,pathlib; p=pathlib.Path("YOMI-v420.69.9005.zip"); h=hashlib.sha256(p.read_bytes()).hexdigest(); r=json.loads(pathlib.Path("/tmp/yomi-420699005-build.json").read_text()); assert r["sha256"]==h and r["version"]=="420.69.9005"; d={"product":"YOMI - YouTube OBS Music Interface","version":"420.69.9005","package_name":"YOMI-v420.69.9005.zip","package_url":"https://raw.githubusercontent.com/TheSensibleStreamer/YOMI-YouTube-Playlist-Randomizer/main/YOMI-v420.69.9005.zip","sha256":h,"summary":"","changelog_url":"https://github.com/TheSensibleStreamer/YOMI-YouTube-Playlist-Randomizer","update_compatibility":"one-hop-latest"}; pathlib.Path("update.json").write_text(json.dumps(d,indent=2),encoding="utf-8")'
          rm -rf payload installer
          cp -a .release-work/payload payload
          cp -a .release-work/installer installer
          cp ".release-work/INSTALL YOMI.cmd" "INSTALL YOMI.cmd"
          rm -rf .release-work
          python -c 'from pathlib import Path; p=Path("README.md"); t=p.read_text(encoding="utf-8").replace("Current version: 420.69.9004","Current version: 420.69.9005").replace("YOMI-v420.69.9004.zip","YOMI-v420.69.9005.zip"); p.write_text(t,encoding="utf-8")'
      - name: Publish clean root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf release/420.69.9005
          rm -f release/420.69.9005.trigger
          rm -f .github/workflows/publish-420699005.yml
          git add -A
          git commit -m "Publish YOMI 420.69.9005"
          git push origin HEAD:main
