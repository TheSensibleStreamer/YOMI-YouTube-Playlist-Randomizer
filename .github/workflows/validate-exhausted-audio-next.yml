name: Validate YOMI exhausted-audio Next recovery
on:
  push:
    paths:
      - "payload/app/music.lua"
      - "tests/exhausted-audio-next.py"
      - ".github/workflows/validate-exhausted-audio-next.yml"
  pull_request:
    paths:
      - "payload/app/music.lua"
      - "tests/exhausted-audio-next.py"
      - ".github/workflows/validate-exhausted-audio-next.yml"
permissions:
  contents: read
jobs:
  lua-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet lupa
      - name: Reproduce exhausted Next, uncached mpv handoff, and manual retry
        run: python tests/exhausted-audio-next.py
