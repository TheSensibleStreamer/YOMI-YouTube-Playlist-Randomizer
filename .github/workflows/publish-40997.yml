name: Publish YOMI 4.2.0.9.9.7
on:
  push:
    paths:
      - "release/4.2.0.9.9.7.trigger"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build verified package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-work
          mkdir .release-work
          cp -a payload .release-work/payload
          cp -a installer .release-work/installer
          cp "INSTALL YOMI.cmd" ".release-work/INSTALL YOMI.cmd"
          python release/4.2.0.9.9.7/build.py .release-work YOMI-Windows.zip | tee /tmp/yomi-40997-build.json
          cp YOMI-Windows.zip YOMI-v4.2.0.9.9.7.zip
          python -c 'import hashlib,json,pathlib; p=pathlib.Path("YOMI-v4.2.0.9.9.7.zip"); h=hashlib.sha256(p.read_bytes()).hexdigest(); r=json.loads(pathlib.Path("/tmp/yomi-40997-build.json").read_text()); assert r["sha256"]==h and r["version"]=="4.2.0.9.9.7"; d={"product":"YOMI - YouTube OBS Music Interface","version":"4.2.0.9.9.7","package_name":"YOMI-v4.2.0.9.9.7.zip","package_url":"https://raw.githubusercontent.com/TheSensibleStreamer/YOMI-YouTube-Playlist-Randomizer/main/YOMI-v4.2.0.9.9.7.zip","sha256":h,"summary":"","changelog_url":"https://github.com/TheSensibleStreamer/YOMI-YouTube-Playlist-Randomizer","update_compatibility":"one-hop-latest"}; pathlib.Path("update.json").write_text(json.dumps(d,indent=2),encoding="utf-8")'
          rm -rf payload installer
          cp -a .release-work/payload payload
          cp -a .release-work/installer installer
          cp ".release-work/INSTALL YOMI.cmd" "INSTALL YOMI.cmd"
          rm -rf .release-work
          python -c 'from pathlib import Path; p=Path("README.md"); t=p.read_text(encoding="utf-8").replace("Current version: 4.2.0.9.9.6","Current version: 4.2.0.9.9.7").replace("YOMI-v4.2.0.9.9.6.zip","YOMI-v4.2.0.9.9.7.zip"); p.write_text(t,encoding="utf-8")'
      - name: Publish clean root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf release/4.2.0.9.9.7
          rm -f release/4.2.0.9.9.7.trigger
          rm -f .github/workflows/publish-40997.yml
          git add -A
          git commit -m "Publish YOMI 4.2.0.9.9.7"
          git push origin HEAD:main
