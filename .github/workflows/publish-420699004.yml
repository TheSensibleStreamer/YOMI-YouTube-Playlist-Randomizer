name: Publish YOMI 420.69.9004
on:
  push:
    paths:
      - "release/420.69.9004.trigger"
permissions:
  contents: write

jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate launcher icon and restart relay compilation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $app=(Resolve-Path 'payload/app').Path
          $launcherOut=Join-Path $env:RUNNER_TEMP 'YomiLauncher.exe'
          $relayOut=Join-Path $env:RUNNER_TEMP 'YomiRestartRelay.exe'
          $csc=@(
            (Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'),
            (Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if(-not $csc){throw 'csc.exe not found'}
          & $csc /nologo /target:winexe ('/win32icon:"'+(Join-Path $app 'yomi.ico')+'"') ('/out:"'+$launcherOut+'"') ('"'+(Join-Path $app 'YomiLauncher.cs')+'"')
          if($LASTEXITCODE -ne 0 -or -not(Test-Path $launcherOut)){throw 'Launcher compile failed'}
          & $csc /nologo /target:winexe ('/out:"'+$relayOut+'"') ('"'+(Join-Path $app 'YomiRestartRelay.cs')+'"')
          if($LASTEXITCODE -ne 0 -or -not(Test-Path $relayOut)){throw 'Restart relay compile failed'}
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'installer/install.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count){throw ('Installer parse failed: '+$errors[0].Message)}
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'payload/app/YomiPublicUpdateHost.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count){throw ('Updater host parse failed: '+$errors[0].Message)}

  publish:
    needs: validate-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build verified package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-work
          mkdir .release-work
          cp -a payload .release-work/payload
          cp -a installer .release-work/installer
          cp "INSTALL YOMI.cmd" ".release-work/INSTALL YOMI.cmd"
          python release/420.69.9004/build.py .release-work YOMI-Windows.zip | tee /tmp/yomi-420699004-build.json
          cp YOMI-Windows.zip YOMI-v420.69.9004.zip
          python -c 'import hashlib,json,pathlib; p=pathlib.Path("YOMI-v420.69.9004.zip"); h=hashlib.sha256(p.read_bytes()).hexdigest(); r=json.loads(pathlib.Path("/tmp/yomi-420699004-build.json").read_text()); assert r["sha256"]==h and r["version"]=="420.69.9004"; d={"product":"YOMI - YouTube OBS Music Interface","version":"420.69.9004","package_name":"YOMI-v420.69.9004.zip","package_url":"https://raw.githubusercontent.com/TheSensibleStreamer/YOMI-YouTube-Playlist-Randomizer/main/YOMI-v420.69.9004.zip","sha256":h,"summary":"","changelog_url":"https://github.com/TheSensibleStreamer/YOMI-YouTube-Playlist-Randomizer","update_compatibility":"one-hop-latest"}; pathlib.Path("update.json").write_text(json.dumps(d,indent=2),encoding="utf-8")'
          rm -rf payload installer
          cp -a .release-work/payload payload
          cp -a .release-work/installer installer
          cp ".release-work/INSTALL YOMI.cmd" "INSTALL YOMI.cmd"
          rm -rf .release-work
          python -c 'from pathlib import Path; p=Path("README.md"); t=p.read_text(encoding="utf-8").replace("Current version: 420.69.9003","Current version: 420.69.9004").replace("YOMI-v420.69.9003.zip","YOMI-v420.69.9004.zip"); p.write_text(t,encoding="utf-8")'
      - name: Publish clean root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf release/420.69.9004
          rm -f release/420.69.9004.trigger
          rm -f .github/workflows/publish-420699004.yml
          git add -A
          git commit -m "Publish YOMI 420.69.9004"
          git push origin HEAD:main
