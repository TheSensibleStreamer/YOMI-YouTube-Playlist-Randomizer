name: Publish simple YOMI release

on:
  push:
    paths:
      - ".github/cleanup-release.trigger"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish current Windows ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "6ac4431a08935118c5020440844485027aa4a617f261973d43186c6575bfe531  YOMI-v4.2.0.9.3.zip" | sha256sum -c -
          cp YOMI-v4.2.0.9.3.zip YOMI-Windows.zip
          gh release create v4.2.0.9.3 YOMI-Windows.zip --title "YOMI 4.2.0.9.3" --notes "Current Windows release. Download YOMI-Windows.zip, extract it, then run INSTALL YOMI.cmd." --latest