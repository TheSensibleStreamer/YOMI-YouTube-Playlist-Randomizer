name: Publish YOMI 4.2.0.9.4

on:
  push:
    paths:
      - "release/4.2.0.9.4.trigger"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build verified package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-work
          mkdir .release-work
          cp -a payload .release-work/payload
          cp -a installer .release-work/installer
          cp "INSTALL YOMI.cmd" ".release-work/INSTALL YOMI.cmd"

          python release/4.2.0.9.4/build.py .release-work YOMI-Windows.zip | tee /tmp/yomi-4094-build.json

          python - <<'PY'
import hashlib, json
from pathlib import Path
package = Path("YOMI-Windows.zip")
h = hashlib.sha256(package.read_bytes()).hexdigest()
result = json.loads(Path("/tmp/yomi-4094-build.json").read_text())
if result["sha256"] != h or result["version"] != "4.2.0.9.4":
    raise SystemExit("outer package verification failed")
update = {
    "product": "YOMI - YouTube OBS Music Interface",
    "version": "4.2.0.9.4",
    "package_name": "YOMI-Windows.zip",
    "package_url": "https://raw.githubusercontent.com/TheSensibleStreamer/YOMI-YouTube-Playlist-Randomizer/main/YOMI-Windows.zip",
    "sha256": h,
    "summary": "YOMI 4.2.0.9.4: fixes per-font previews in Settings and removes residual native/gray ComboBox chrome while leaving scrollbar behavior unchanged.",
    "changelog_url": "https://github.com/TheSensibleStreamer/YOMI-YouTube-Playlist-Randomizer"
}
Path("update.json").write_text(json.dumps(update, indent=2) + "\n", encoding="utf-8")
PY

          rm -rf payload installer
          cp -a .release-work/payload payload
          cp -a .release-work/installer installer
          cp ".release-work/INSTALL YOMI.cmd" "INSTALL YOMI.cmd"
          rm -rf .release-work

          python - <<'PY'
from pathlib import Path
p = Path("README.md")
t = p.read_text(encoding="utf-8")
t = t.replace("Current version: 4.2.0.9.3", "Current version: 4.2.0.9.4")
p.write_text(t, encoding="utf-8")
PY

      - name: Publish clean root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf release/4.2.0.9.4
          rm -f release/4.2.0.9.4.trigger
          rm -f .github/workflows/publish-4094.yml

          git add -A
          git commit -m "Publish YOMI 4.2.0.9.4"
          git push origin HEAD:main