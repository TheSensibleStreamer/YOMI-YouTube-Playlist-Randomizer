name: Publish YOMI 420.69.9018
on:
  push:
    paths:
      - "release/420.69.9018.trigger"
permissions:
  contents: write

jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate updater and media resampling
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'

          foreach($script in @('installer/install.ps1','payload/app/update.ps1','payload/app/YomiPublicUpdateHost.ps1','payload/app/server.ps1','payload/app/YomiDiagnosticBundle.ps1','payload/app/unavailable-track-audit.ps1')){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ($script+' parse failed: '+$errors[0].Message)}
          }
          [xml](Get-Content (Resolve-Path 'payload/app/YomiControllerWpf.xaml') -Raw) | Out-Null
          Get-Content (Resolve-Path 'payload/app/default-config.json') -Raw | ConvertFrom-Json | Out-Null

          function Resolve-FrameworkReferencePath([string]$Name) {
            $loaded=[AppDomain]::CurrentDomain.GetAssemblies() | Where-Object { $_.GetName().Name -eq $Name -and $_.Location } | Select-Object -First 1
            if($loaded){ return [string]$loaded.Location }
            $dirs=@()
            try { $runtimeDir=[Runtime.InteropServices.RuntimeEnvironment]::GetRuntimeDirectory(); if($runtimeDir){$dirs+=$runtimeDir;$dirs+=(Join-Path $runtimeDir 'WPF')} } catch {}
            foreach($frameworkRoot in @((Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319'),(Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319'))){$dirs+=$frameworkRoot;$dirs+=(Join-Path $frameworkRoot 'WPF')}
            $pf86=[Environment]::GetFolderPath([System.Environment+SpecialFolder]::ProgramFilesX86)
            if($pf86){$refRoot=Join-Path $pf86 'Reference Assemblies\Microsoft\Framework\.NETFramework';if(Test-Path $refRoot){foreach($v in @(Get-ChildItem $refRoot -Directory -ErrorAction SilentlyContinue|Where-Object{$_.Name -like 'v4*'}|Sort-Object Name -Descending)){$dirs+=$v.FullName;$dirs+=(Join-Path $v.FullName 'Facades')}}}
            foreach($dir in @($dirs|Where-Object{$_}|Select-Object -Unique)){$candidate=Join-Path $dir ($Name+'.dll');if(Test-Path $candidate){return $candidate}}
            throw ('Missing framework reference: '+$Name)
          }

          $csc=@((Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'),(Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe')) | Where-Object {Test-Path $_} | Select-Object -First 1
          if(-not $csc){throw 'csc.exe not found'}
          $app=(Resolve-Path 'payload/app').Path

          $controllerSource=Join-Path $app 'YomiControllerWpf.cs'
          $controllerManifest=Join-Path $app 'YomiControllerWpf.manifest'
          $controllerOut=Join-Path $env:RUNNER_TEMP 'YomiControllerWpf.exe'
          $refs=@('PresentationFramework','PresentationCore','WindowsBase','System.Xaml','WindowsFormsIntegration','System.Windows.Forms','System.Drawing','System.Web.Extensions','System.Xml','System','System.Core')
          $args=@('/nologo','/noconfig','/codepage:65001','/target:winexe','/platform:anycpu','/optimize+','/debug-',('/win32manifest:"'+$controllerManifest+'"'),('/out:"'+$controllerOut+'"'))
          foreach($refName in $refs){$args+=('/reference:"'+(Resolve-FrameworkReferencePath $refName)+'"')}
          $args+=('"'+$controllerSource+'"')
          $compile=& $csc @args 2>&1
          if($LASTEXITCODE -ne 0){throw ('Controller compile failed: '+($compile -join [Environment]::NewLine))}
          if(-not(Test-Path $controllerOut)){throw 'Controller compile produced no executable'}

          $obsOut=Join-Path $env:RUNNER_TEMP 'YomiObsServer.exe'
          $obsArgs=@('/nologo','/noconfig','/codepage:65001','/target:exe','/platform:anycpu','/optimize+','/debug-',('/out:"'+$obsOut+'"'),('/reference:"'+(Resolve-FrameworkReferencePath 'System')+'"'),('/reference:"'+(Resolve-FrameworkReferencePath 'System.Core')+'"'),('"'+(Join-Path $app 'YomiObsServerHost.cs')+'"'))
          $obsCompile=& $csc @obsArgs 2>&1
          if($LASTEXITCODE -ne 0){throw ('OBS server compile failed: '+($obsCompile -join [Environment]::NewLine))}
          if(-not(Test-Path $obsOut)){throw 'OBS server compile produced no executable'}

          $obs=Get-Content (Join-Path $app 'YomiObsServerHost.cs') -Raw
          foreach($required in @("artCanvas=document.getElementById('artCanvas')","videoCanvas=document.getElementById('videoCanvas')","imageSmoothingEnabled=false","mediaResampleMode=nearestScale?'nearest':'smooth'","c.obs_media_scaling||'Smooth'","c.media_aspect_layout||'Reflow'","mediaPairSvg=document.getElementById('mediaPairSvg')","mediaPairRect=document.getElementById('mediaPairRect')","mediaPairLine=document.getElementById('mediaPairLine')","function layoutMediaPair(active,vertical,bp,color,radiusPx)","mediaPairRect.setAttribute('stroke',color)","mediaPairLine.setAttribute('stroke-linecap','butt')","function parseHexColor(v)","vizCtx.imageSmoothingEnabled=false","forceSolid=vizColorMode==='solid'","let mr=(showVid?vid:art).getBoundingClientRect()")){
            if(-not $obs.Contains($required)){throw ('OBS media/layout repair missing: '+$required)}
          }
          foreach($forbidden in @('mediaPairOutline','mediaSeam',"pixelScale?'pixelated':'auto'")){
            if($obs.Contains($forbidden)){throw ('Obsolete OBS geometry/scaling path still present: '+$forbidden)}
          }

          $controller=Get-Content $controllerSource -Raw
          foreach($required in @('SettingsObsMediaScaling','FillCombo(_settingsObsMediaScaling, "Smooth", "Nearest")','VisualizerPixelSizeChoiceFromConfig','width = 40; height = 10','page.ScrollToVerticalOffset','"media_aspect_layout", "Reflow"','ComboText(_settingsMediaAspectLayout, "Reflow")','LaunchUnavailableTrackAudit','unavailable-track-audit.ps1','OpenSelectedQueueSource','Open source in browser','Unavailable track audit')){
            if(-not $controller.Contains($required)){throw ('Controller audit/settings repair missing: '+$required)}
          }
          if($controller.Contains('combo.SelectedIndex = next')){throw 'Settings wheel can still mutate closed combo boxes'}

          $music=Get-Content (Join-Path $app 'music.lua') -Raw
          foreach($required in @('next_subset_transport_occurrence(base,direction,false)','next_occurrence(base,direction,false)','if known_bad(i) then return end','AUDIO QUARANTINE track ','exhausted_unavailable_error','web_embedded,default','android,default')){
            if(-not $music.Contains($required)){throw ('Playback quarantine repair missing: '+$required)}
          }
          foreach($forbidden in @('AUDIO PERMANENT RECHECK track ','next_occurrence(cursor,1,true)','next_subset_transport_occurrence(base,direction,true)')){
            if($music.Contains($forbidden)){throw ('Unavailable-track resurrection path still present: '+$forbidden)}
          }

          $audit=Get-Content (Join-Path $app 'unavailable-track-audit.ps1') -Raw
          foreach($required in @('controller-library.json','state\session.json','pool-current.json','web_embedded,default','android,default','YOMI UNAVAILABLE TRACK AUDIT','Export-Csv')){
            if(-not $audit.Contains($required)){throw ('Unavailable-track audit missing: '+$required)}
          }

          $diag=Get-Content (Join-Path $app 'YomiDiagnosticBundle.ps1') -Raw
          foreach($required in @('YOMI Diagnostic Bundle v12 / R61.106.53','$excludedTreeRegex','Log-Tails','$f.Length -lt 4MB','Select-Object -First 1500')){
            if(-not $diag.Contains($required)){throw ('Compact diagnostic bundle repair missing: '+$required)}
          }

          $defaults=Get-Content (Join-Path $app 'default-config.json') -Raw | ConvertFrom-Json
          if($defaults.media_aspect_layout -ne 'Reflow'){throw 'Reflow is not the default media aspect layout'}
          if($defaults.visualizer_pixel_size -ne 'Extra Chunky' -or [int]$defaults.visualizer_internal_width -ne 40 -or [int]$defaults.visualizer_internal_height -ne 10){throw 'Visualizer chunky defaults are not restored'}

          $updater=Get-Content (Join-Path $app 'update.ps1') -Raw
          if(-not $updater.Contains('Restart handoff is ready.')){throw 'Updater restart handoff missing'}
          if($updater.Contains("Start-Process -FilePath $launcher -ArgumentList 'controller'")){throw 'Updater still has competing relaunch owner'}
          $updateHostText=Get-Content (Join-Path $app 'YomiPublicUpdateHost.ps1') -Raw
          if(-not $updateHostText.Contains('Queue-DetachedRelaunch')){throw 'Detached restart relay not wired'}
          if(-not $updateHostText.Contains('detached restart relay owns the single post-update relaunch')){throw 'Single restart ownership marker missing'}

  publish:
    needs: validate-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parse playback Lua
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet luaparser
          python - <<'PY'
          from pathlib import Path
          from luaparser import ast
          ast.parse(Path("payload/app/music.lua").read_text(encoding="utf-8"))
          print("music.lua parse PASS")
          PY
      - name: Compile playback Lua with LuaJIT
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit
          luajit -e 'local f,e=loadfile("payload/app/music.lua"); assert(f,e); print("music.lua LuaJIT compile PASS")'
      - name: Build verified package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-work
          mkdir .release-work
          cp -a payload .release-work/payload
          cp -a installer .release-work/installer
          cp "INSTALL YOMI.cmd" ".release-work/INSTALL YOMI.cmd"
          python release/420.69.9018/build.py .release-work YOMI-Windows.zip | tee /tmp/yomi-420699018-build.json
          cp YOMI-Windows.zip YOMI-v420.69.9018.zip
          python -c 'import hashlib,json,pathlib; p=pathlib.Path("YOMI-v420.69.9018.zip"); h=hashlib.sha256(p.read_bytes()).hexdigest(); r=json.loads(pathlib.Path("/tmp/yomi-420699018-build.json").read_text()); assert r["sha256"]==h and r["version"]=="420.69.9018"; d={"product":"YOMI - YouTube OBS Music Interface","version":"420.69.9018","package_name":"YOMI-v420.69.9018.zip","package_url":"https://raw.githubusercontent.com/TheSensibleStreamer/YOMI-YouTube-Playlist-Randomizer/main/YOMI-v420.69.9018.zip","sha256":h,"summary":"","changelog_url":"https://github.com/TheSensibleStreamer/YOMI-YouTube-Playlist-Randomizer","update_compatibility":"one-hop-latest"}; pathlib.Path("update.json").write_text(json.dumps(d,indent=2),encoding="utf-8")'
          rm -rf payload installer
          cp -a .release-work/payload payload
          cp -a .release-work/installer installer
          cp ".release-work/INSTALL YOMI.cmd" "INSTALL YOMI.cmd"
          rm -rf .release-work
          python -c 'from pathlib import Path; p=Path("README.md"); t=p.read_text(encoding="utf-8").replace("Current version: 420.69.9017","Current version: 420.69.9018").replace("YOMI-v420.69.9017.zip","YOMI-v420.69.9018.zip"); p.write_text(t,encoding="utf-8")'
      - name: Publish clean root
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf release/420.69.9018
          rm -f release/420.69.9018.trigger
          rm -f .github/workflows/publish-420699018.yml
          git add -A
          git commit -m "Publish YOMI 420.69.9018"
          git push origin HEAD:main
